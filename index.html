<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Indian Uphill Bus Simulator 3D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      // Bus unlock modification script - unlocks all buses at game start
      var companyName = "Indian Uphill Bus Simulator 3D";
      var productName = "Indian Uphill Bus Simulator 3D";
      var INIT_CHECK_INTERVAL_MS = 100; // Check every 100ms
      var INIT_DURATION_SECONDS = 5; // Check for 5 seconds
      var MAX_INIT_ATTEMPTS = (INIT_DURATION_SECONDS * 1000) / INIT_CHECK_INTERVAL_MS; // 50 attempts
      var POST_INIT_DELAY_MS = 100; // Delay after Unity runtime init
      
      // This function unlocks all buses by setting unlock keys in localStorage
      function unlockAllBuses() {
        console.log("[Bus Unlock] Unlocking all buses");
        
        // Try various common unlock key patterns for buses
        var unlockPatterns = [
          // Pattern 1: BusXUnlocked
          { prefix: "Bus", suffix: "Unlocked", count: 20 },
          // Pattern 2: VehicleXUnlocked
          { prefix: "Vehicle", suffix: "Unlocked", count: 20 },
          // Pattern 3: bus_X_unlocked
          { prefix: "bus_", suffix: "_unlocked", count: 20 },
          // Pattern 4: UnlockedBusX
          { prefix: "UnlockedBus", suffix: "", count: 20 },
          // Pattern 5: BusX (simple pattern)
          { prefix: "Bus", suffix: "", count: 20 },
          // Pattern 6: Unlock_X
          { prefix: "Unlock_", suffix: "", count: 20 }
        ];
        
        // Set unlock keys for all patterns
        unlockPatterns.forEach(function(pattern) {
          for (var i = 0; i <= pattern.count; i++) {
            var key = companyName + "." + productName + "." + pattern.prefix + i + pattern.suffix;
            // Try both numeric 1 and string "1" for unlocked state
            localStorage.setItem(key, "1");
            localStorage.setItem(key + "_int", "1");
          }
        });
        
        // Also set some global unlock flags
        localStorage.setItem(companyName + "." + productName + ".AllBusesUnlocked", "1");
        localStorage.setItem(companyName + "." + productName + ".UnlockAll", "1");
        localStorage.setItem(companyName + "." + productName + ".AllVehiclesUnlocked", "1");
        
        console.log("[Bus Unlock] All bus unlock keys have been set");
      }
      
      // Call immediately
      unlockAllBuses();
      
      // Also set it periodically during Unity's initialization
      var attempts = 0;
      var interval = setInterval(function() {
        unlockAllBuses();
        attempts++;
        if (attempts >= MAX_INIT_ATTEMPTS) {
          clearInterval(interval);
          console.log("[Bus Unlock] Finished unlocking buses");
        }
      }, INIT_CHECK_INTERVAL_MS);
      
      // Initialize Unity game
      var gameInstance = UnityLoader.instantiate(
        "gameContainer",
        "Build/IndianUphillBusSimulator3D-1_0.json",
        {
          onProgress: UnityProgress,
          Module: {
            onRuntimeInitialized: function() {
              UnityProgress(gameInstance, "complete");
              // Clear the interval since Unity is initialized
              clearInterval(interval);
              // Unlock buses one final time after Unity runtime is fully initialized
              setTimeout(function() {
                unlockAllBuses();
                console.log("[Bus Unlock] Final unlock after Unity initialization");
              }, POST_INIT_DELAY_MS);
            }
          }
        }
      );
    </script>
</head>
<body>
    <div class="webgl-content">
        <div id="gameContainer" style="width: 800px; height: 600px; margin: auto"></div>
    </div>
</body>
<script src="https://trafficjam3d.github.io/trafficjam3d/site.js"></script>
</html>
