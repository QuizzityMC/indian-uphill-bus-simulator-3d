<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Indian Uphill Bus Simulator 3D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      // Bus unlock modification script - unlocks all buses at game start
      var companyName = "Indian Uphill Bus Simulator 3D";
      var productName = "Indian Uphill Bus Simulator 3D";
      
      // This function attempts to unlock all buses by setting PlayerPrefs keys in localStorage
      // NOTE: These are the ACTUAL keys found from decompiling the Unity data file
      // However, this may not work because Unity WebGL games compile unlock logic into WASM
      function unlockAllBuses(silent) {
        if (!silent) {
          console.log("[Bus Unlock] Setting PlayerPrefs keys (discovered from decompilation)");
        }
        
        // === ACTUAL KEYS FOUND IN DECOMPILED DATA ===
        // These are the real PlayerPrefs keys used by the game:
        var actualKeys = {
          // Currency - Set to 9999999999 as requested
          "TotalCoins": "9999999999",
          "totalcoins": "9999999999",
          "Coins": "9999999999",
          "coins": "9999999999",
          
          // Level unlock
          "NumOfLevelsUnlocked": "100",
          "LevelAllUnlock": "1",
          "Current_Level": "1",
          
          // Tutorial/Character
          "IsTutorialCompleted": "1",
          "UnlockedCharacterName": "AllUnlocked",
          "LifeMaxDistanceTravelled": "999999",
          
          // Selected bus (0-7 are available buses based on Bus_1E through Bus_7E found)
          "SelectedBus": "0"
        };
        
        // Set each actual key with Unity PlayerPrefs format
        for (var key in actualKeys) {
          var value = actualKeys[key];
          // Unity WebGL PlayerPrefs format: "CompanyName.ProductName.Key"
          localStorage.setItem(companyName + "." + productName + "." + key, value);
          // Also try direct key
          localStorage.setItem(key, value);
        }
        
        // === BUS UNLOCK PATTERNS ===
        // Based on discovered GameObjects: Bus_1E through Bus_7E
        for (var i = 1; i <= 7; i++) {
          var busKey = companyName + "." + productName + ".Bus_" + i + "E_Unlocked";
          localStorage.setItem(busKey, "1");
          localStorage.setItem("Bus_" + i + "E_Unlocked", "1");
          localStorage.setItem(companyName + "." + productName + ".Bus" + i + "Unlocked", "1");
          localStorage.setItem("Bus" + i + "Unlocked", "1");
        }
        
        // === LEVEL UNLOCK ===
        // Based on discovered levels: Level_01 through Level_20
        for (var i = 1; i <= 20; i++) {
          var levelKey = companyName + "." + productName + ".Level_" + (i < 10 ? "0" + i : i) + "_Unlocked";
          localStorage.setItem(levelKey, "1");
          localStorage.setItem("Level_" + (i < 10 ? "0" + i : i) + "_Unlocked", "1");
          localStorage.setItem(companyName + "." + productName + ".Level" + i + "Unlocked", "1");
        }
        
        // === IAP UNLOCK FLAGS ===
        // Based on discovered: IAPUnloackAllBus (note the typo in original!)
        localStorage.setItem(companyName + "." + productName + ".IAPUnloackAllBus", "1");
        localStorage.setItem("IAPUnloackAllBus", "1");
        localStorage.setItem(companyName + "." + productName + ".UnlockAllBus", "1");
        localStorage.setItem("UnlockAllBus", "1");
        
        // === ADDITIONAL GLOBAL FLAGS ===
        var globalFlags = [
          "AllBusesUnlocked", "UnlockAll", "AllVehiclesUnlocked",
          "PremiumUnlocked", "FullVersion", "AllLevelsUnlocked",
          "VIP", "Premium", "NoAds"
        ];
        
        globalFlags.forEach(function(flag) {
          localStorage.setItem(companyName + "." + productName + "." + flag, "1");
          localStorage.setItem(flag, "1");
        });
        
        if (!silent) {
          console.log("[Bus Unlock] PlayerPrefs keys set. Keys found from decompilation:");
          console.log("  - TotalCoins, NumOfLevelsUnlocked, LevelAllUnlock, SelectedBus");
          console.log("  - Buses: Bus_1E through Bus_7E");
          console.log("  - Levels: Level_01 through Level_20");
          console.log("  - IAP: IAPUnloackAllBus (typo in original game code)");
          console.log("[Bus Unlock] NOTE: This may not work due to WASM-compiled unlock logic");
        }
      }
      
      // Call immediately before anything else loads (with logging)
      unlockAllBuses(false);
      
      // Game instance variable - will be set when DOM is ready
      var gameInstance = null;
      
      // Initialize Unity game when DOM is ready
      document.addEventListener("DOMContentLoaded", function() {
        gameInstance = UnityLoader.instantiate(
          "gameContainer",
          "Build/IndianUphillBusSimulator3D-1_0.json",
          {
            onProgress: UnityProgress,
            Module: {
              onRuntimeInitialized: function() {
                UnityProgress(gameInstance, "complete");
                console.log("[Bus Unlock] Unity runtime initialized, applying final unlocks");
                // Schedule unlock attempts at 500ms, 1000ms, and 2500ms after initialization
                // This ensures unlock keys are set during Unity's PlayerPrefs initialization
                [500, 1000, 2500].forEach(function(delay, index, arr) {
                  setTimeout(function() {
                    unlockAllBuses(true);
                    if (index === arr.length - 1) {
                      console.log("[Bus Unlock] Final unlock complete");
                    }
                  }, delay);
                });
              }
            }
          }
        );
      });
    </script>
</head>
<body>
    <div class="webgl-content">
        <div id="gameContainer" style="width: 800px; height: 600px; margin: auto"></div>
    </div>
    <!-- Multiplayer System -->
    <script src="multiplayer.js"></script>
</body>
</html>
