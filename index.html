<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Indian Uphill Bus Simulator 3D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      // Set starting money to 99,999,999
      (function() {
        var STARTING_MONEY = 99999999;
        var companyName = "Indian Uphill Bus Simulator 3D";
        var productName = "Indian Uphill Bus Simulator 3D";
        
        // Clear any existing save data and set fresh value
        function resetGameWithMoney() {
          // Clear localStorage
          for (var i = localStorage.length - 1; i >= 0; i--) {
            var key = localStorage.key(i);
            if (key && key.indexOf(companyName) === 0) {
              localStorage.removeItem(key);
            }
          }
          
          // Set the money value
          var lsKey = companyName + "." + productName + ".TotalCoins";
          localStorage.setItem(lsKey, String(STARTING_MONEY));
          
          // Clear IndexedDB
          var dbName = '/idbfs/' + companyName + '/' + productName;
          var deleteRequest = indexedDB.deleteDatabase(dbName);
          deleteRequest.onsuccess = function() {
            console.log("Game data reset with " + STARTING_MONEY + " coins");
            window.location.reload();
          };
        }
        
        // Check if we should reset (first time only)
        var resetKey = '_moneyModApplied';
        if (!localStorage.getItem(resetKey)) {
          console.log("First load detected - resetting game with " + STARTING_MONEY + " coins");
          localStorage.setItem(resetKey, 'true');
          resetGameWithMoney();
          return; // Will reload
        }
        
        // Set in localStorage for subsequent loads
        var lsKey = companyName + "." + productName + ".TotalCoins";
        localStorage.setItem(lsKey, String(STARTING_MONEY));
        
        console.log("Money mod active - starting money set to " + STARTING_MONEY);
      })();
      
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/IndianUphillBusSimulator3D-1_0.json", {onProgress: UnityProgress,Module:{onRuntimeInitialized: function() {UnityProgress(gameInstance, "complete")}}});
    </script>
</head>
<body>
    <div class="webgl-content">
        <div id="gameContainer" style="width: 800px; height: 600px; margin: auto"></div>
    </div>
</body>
<script src="https://trafficjam3d.github.io/trafficjam3d/site.js"></script>
</html>
