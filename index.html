<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Indian Uphill Bus Simulator 3D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      // Money modification script - runs AFTER Unity runtime initializes
      var STARTING_MONEY = 999999999;
      var companyName = "Indian Uphill Bus Simulator 3D";
      var productName = "Indian Uphill Bus Simulator 3D";
      var MONEY_KEY = companyName + "." + productName + ".TotalCoins";
      var INIT_CHECK_INTERVAL_MS = 100; // Check every 100ms
      var INIT_DURATION_SECONDS = 5; // Check for 5 seconds
      var MAX_INIT_ATTEMPTS = (INIT_DURATION_SECONDS * 1000) / INIT_CHECK_INTERVAL_MS; // 50 attempts
      var POST_INIT_DELAY_MS = 100; // Delay after Unity runtime init
      
      // This function sets the starting money in localStorage
      function setStartingMoney() {
        console.log("[Money Mod] Setting starting money to " + STARTING_MONEY);
        localStorage.setItem(MONEY_KEY, String(STARTING_MONEY));
      }
      
      // Call immediately
      setStartingMoney();
      
      // Also set it periodically for the first 5 seconds to catch Unity's initialization
      var attempts = 0;
      var interval = setInterval(function() {
        setStartingMoney();
        attempts++;
        if (attempts >= MAX_INIT_ATTEMPTS) {
          clearInterval(interval);
          console.log("[Money Mod] Finished setting starting money");
        }
      }, INIT_CHECK_INTERVAL_MS);
      
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/IndianUphillBusSimulator3D-1_0.json", {onProgress: UnityProgress,Module:{onRuntimeInitialized: function() {
        UnityProgress(gameInstance, "complete");
        // Set money one final time after Unity runtime is fully initialized
        setTimeout(function() {
          setStartingMoney();
          console.log("[Money Mod] Final money set after Unity initialization");
        }, POST_INIT_DELAY_MS);
      }}});
    </script>
</head>
<body>
    <div class="webgl-content">
        <div id="gameContainer" style="width: 800px; height: 600px; margin: auto"></div>
    </div>
</body>
<script src="https://trafficjam3d.github.io/trafficjam3d/site.js"></script>
</html>
